name: Python AI Engine CI & Unit Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'ai_engine/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ai_engine/**'
      - 'tests/**'
      - 'scripts/**'

jobs:
  python-test-suite:
    name: Run Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ai_engine/requirements.txt ]; then pip install -r ai_engine/requirements.txt; fi

      - name: Execute Python AI Engine self-test
        run: |
          python ai_engine/main.py

      - name: Execute automated unit test discovery
        run: |
          python scripts/run_python_tests.py

      - name: Run batch CLI verification
        run: |
          python ai_engine/cli.py batch --count 10
