version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=aicte_portal_secure_jwt_secret_sih_2026_governance
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - DEMO_MODE=true
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/prisma/dev.db:/app/prisma/dev.db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - server
