version: '3.8'

services:
  anumatisetu-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: anumatisetu-backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=anumatisetu_production_secret_key_2026
    ports:
      - "5000:5000"
    volumes:
      - ./server/prisma:/app/prisma
      - ./server/uploads:/app/uploads

  anumatisetu-client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: anumatisetu-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - anumatisetu-server
