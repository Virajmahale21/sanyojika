version: "3.8"

services:
  sanyojika-web:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - sanyojika-api

  sanyojika-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://sanyojika:secret@postgres:5432/sanyojika_db
    depends_on:
      - postgres

  sanyojika-ai:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=sanyojika
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=sanyojika_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
